<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arjunpuri 1st — Colony Management Portal</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link rel="icon" type="image/jpeg" href="map.jpg">
  
  <!-- Modern Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Android Material Symbols Rounded (Material 3) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <link rel="stylesheet" href="style.css?v=20261013_1225">
</head>
<body>

  <div class="app-wrapper">
    <!-- Header: Royal Archer Theme -->
    <header class="app-header">
      <div class="brand-row">
        <div class="archer-crest" title="Arjunpuri 1st Satellite Map (Google Earth)">
          <img src="map.jpg" alt="Arjunpuri 1st Map" class="crest-map-img">
        </div>
        <div class="brand-titles">
          <h1>Arjunpuri 1<sup>st</sup></h1>
          <span>अर्जुनपुरी 1<sup>st</sup> लिंक रोड • वार्ड 145 • जयपुर 302015</span>
        </div>
      </div>
      <div class="header-right">
        <div class="header-badge">
          <span class="material-symbols-rounded" style="font-size: 14px;">verified</span>
          <span id="plot-counter">26 Plots</span>
        </div>
        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Light / Dark Theme" aria-label="Toggle Theme">
          <span class="material-symbols-rounded theme-icon" id="theme-icon">light_mode</span>
        </button>
      </div>
    </header>

    <!-- Instant Universal Search -->
    <div class="search-island">
      <div class="search-field">
        <span class="material-symbols-rounded search-icon">search</span>
        <input 
          type="text" 
          id="main-search-input" 
          class="search-input" 
          placeholder="खोजें: प्लॉट, नाम, गाड़ी नंबर (8634), या मोबाइल..." 
          autocomplete="off"
          autocorrect="off"
        >
        <button id="clear-search-btn" class="clear-search-btn" title="Clear">
          <span class="material-symbols-rounded" style="font-size: 18px;">close</span>
        </button>
      </div>
    </div>

    <!-- Micro Filter Strip -->
    <div class="filter-strip" id="filter-strip">
      <button class="micro-pill active" data-filter="all">
        <span class="material-symbols-rounded" style="font-size: 14px;">grid_view</span>
        All Plots
      </button>
      <button class="micro-pill" data-filter="vehicles">
        <span class="material-symbols-rounded" style="font-size: 14px;">directions_car</span>
        Vehicles
      </button>
      <button class="micro-pill" data-filter="tenants">
        <span class="material-symbols-rounded" style="font-size: 14px;">key</span>
        Tenants & PGs
      </button>
      <button class="micro-pill" data-filter="encroachment">
        <span class="material-symbols-rounded" style="font-size: 14px;">report</span>
        Encroachments
      </button>
      <button class="micro-pill" data-filter="verified">
        <span class="material-symbols-rounded" style="font-size: 14px;">verified</span>
        Police Verified
      </button>
    </div>

    <!-- VIEW 1: Directory List (High Density) -->
    <main id="view-directory" class="view-panel">
      <div id="directory-list" class="directory-list">
        <!-- Rendered dynamically -->
      </div>
    </main>

    <!-- VIEW 2: 1-Click Grievance Launchers -->
    <section id="view-grievances" class="view-panel" style="display: none;">
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.85rem;">
        1-Click Government Grievance Portals (बिजली, पानी, नगर निगम):
      </div>
      <div id="grievance-list">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- VIEW 3: Authorities & Help Directory -->
    <section id="view-contacts" class="view-panel" style="display: none;">
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.85rem;">
        पार्षद, कार्यकर्ता, पुलिस व स्थानीय मिस्त्री सहायता:
      </div>
      <div id="contacts-list">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Bottom Dock Navigation -->
    <nav class="bottom-dock">
      <button class="dock-btn active" data-tab="directory">
        <span class="material-symbols-rounded">groups</span>
        Directory
      </button>
      <button class="dock-btn" data-tab="grievances">
        <span class="material-symbols-rounded">bolt</span>
        Grievance
      </button>
      <button class="dock-btn" data-tab="contacts">
        <span class="material-symbols-rounded">contact_phone</span>
        Contacts
      </button>
    </nav>
  </div>

  <!-- Scripts with cache busters -->
  <script src="data.js?v=20261013_1225"></script>
  <script src="app.js?v=20261013_1225"></script>
</body>
</html>
